<script>
    /* =======================
       2. TREE → FLAT CONVERTER
       ======================= */
    function flattenTree(tree) {
        let flat = [];
        let id = 1;

        function walk(node, parentId = null) {
            const currentId = id++;

            flat.push({
                id: currentId,
                parentId: parentId,
                name: node.positionName,
                type: node.type,
                count: node.count || null
            });

            if (node.child) {
                node.child.forEach(c => walk(c, currentId));
            }
        }

        walk(tree);
        return flat;
    }
</script>

<script>
    /* =======================
       3. d3-org-chart RENDER
       ======================= */
    const data = flattenTree(orgTree);

    const chart = new d3.OrgChart()
        .container("#chart-container")
        .data(data)
        .nodeWidth(() => 340)
        .nodeHeight(() => 90)
        .childrenMargin(() => 50)
        .compact(false)
        .nodeContent(d => `
        <div style="
            background:#ffffff;
            border-radius:16px;
            padding:14px;
            border-left:6px solid ${d.data.type === 'people' ? '#0ea5e9' : '#22c55e'};
            box-shadow:0 8px 30px rgba(0,0,0,0.08);
        ">
            <div style="font-weight:700;font-size:14px;">
                ${d.data.name}
            </div>
            ${d.data.count ? `<div style="font-size:12px;color:#555;margin-top:4px;">
                Нийт: ${d.data.count}
            </div>` : ""}
        </div>
    `)
        .onNodeClick(d => chart.setExpanded(d.id, !d.expanded))
        .render();
</script>
