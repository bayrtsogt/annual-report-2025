    <script>
        document.addEventListener("DOMContentLoaded", () => {

            document.querySelectorAll(".section").forEach(section => {
                const tabs = section.querySelectorAll(".tab-btn");
                const cards = section.querySelectorAll(".detail-card");

                if (!tabs.length || !cards.length) return;

                function showTab(id) {
                    cards.forEach(c => c.classList.remove("active"));
                    tabs.forEach(t => t.classList.remove("active"));

                    section.querySelector(`#${id}`)?.classList.add("active");
                    section.querySelector(`.tab-btn[data-tab="${id}"]`)?.classList.add("active");
                }

                tabs.forEach(btn => {
                    btn.addEventListener("click", () => {
                        showTab(btn.dataset.tab);
                    });
                });

                // тухайн section-ий анхны tab
                showTab(tabs[0].dataset.tab);
            });

        });
    </script>
